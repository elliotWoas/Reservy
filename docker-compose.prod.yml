version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reservy-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-reservy}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-reservy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reservy-network

  redis:
    image: redis:7-alpine
    container_name: reservy-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - reservy-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reservy-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-reservy}?schema=public
      JWT_SECRET: ${JWT_SECRET:-reservy-production-jwt-secret-min-32-chars-replace}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: ./uploads
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: reservy-prod-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - reservy-network

volumes:
  postgres_prod_data:
  redis_prod_data:
  api_uploads:

networks:
  reservy-network:
    driver: bridge
